services:
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5402:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

volumes:
  user_postgres_data: